name: Verify app
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: asa_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: asa_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U asa_test" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Migration and security regression tests on PostgreSQL
        run: >-
          mvn -B -f backend/pom.xml test
          -Dspring.datasource.url=jdbc:postgresql://localhost:5432/asa_test
          -Dspring.datasource.username=asa_test
          -Dspring.datasource.password=disposable_ci_only
          -Dspring.datasource.driver-class-name=org.postgresql.Driver
          -Dspring.flyway.enabled=true
          -Dspring.jpa.hibernate.ddl-auto=validate
  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/asa-web typecheck
      - run: pnpm --filter @workspace/asa-mobile typecheck
      - run: pnpm --filter @workspace/asa-web build
      - run: pnpm --filter @workspace/asa-mobile test --runInBand
